name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the game ships plain ES modules, so the site is a file copy.
      # 注意 `_site` 是相对路径：cd 进产物目录再由闸拼绝对路径，这是仓库根那跑不出来的形态
      # （2026-09-30/10-02 两次红就是这个）。ci.yml 的 check 任务原样跑这份清单 + 一个负控，
      # 改了这里的 cp 清单记得同步那里。
      # 原来只拷 index.html/css/js/vendor —— 那样 manifest.webmanifest、sw.js、pwa-register.js、
      # icons/、textures/、og/ 上了部署站全是 404，而本地 109 条断言一条都不会红（本地是从
      # 仓库根直读的）。拷完立刻用同一条闸核对产物里引用是否齐全，漏拷在这一步就红。
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js pwa-register.js _site/
          cp -r css js vendor icons textures og _site/
          ./tools/check_refs.sh _site
          echo "artifact: $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
